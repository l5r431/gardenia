<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You are offline | Gardenia Kindergarten and Primary School</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#14233A">
    <link type="image/png" href="images/favicon-96x96.png" rel="icon" sizes="96x96">
    <link href="images/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180">
    <link href="site.webmanifest" rel="manifest">
    <script src="js/theme.js"></script>
    <link href="css/base.css" rel="stylesheet">
    <style>
      .offline { min-height: 100vh; display: grid; place-items: center; padding: 2rem 0; text-align: center; }
      .offline img { margin: 0 auto 1.25rem; border-radius: var(--r); }
      .offline p { margin-inline: auto; }
      .offline-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; margin-top: 1.5rem; }
    </style>
  </head>
  <body>
    <main class="offline">
      <div class="wrap">
        <img src="images/logo-full-256-original.png" width="96" height="96" alt="Gardenia logo">
        <h1>You are offline</h1>
        <p>
          This page has not been saved on your phone yet. Pages you have opened before still work, and this page will
          load as soon as you have signal again.
        </p>
        <div class="offline-actions">
          <a class="btn btn--dark" href="index.html">Go to the home page</a>
          <button class="btn" type="button" onclick="location.reload()">Try again</button>
        </div>
      </div>
    </main>
  </body>
</html>
